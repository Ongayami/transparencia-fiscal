  var h='<div class="landing"><div class="div-badge">Divisional 3 &mdash; NEA / Litoral &middot; '+D.length+' estaciones</div><div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" id="srcInput" placeholder="Buscar estacion..." autocomplete="off"></div><ul class="slist">';
  for(var i=0;i<sorted.length;i++){var s=sorted[i];h+='<li data-name="'+s.n.toLowerCase()+' '+s.c+'"><a href="?eess='+s.c+'"><div><div class="sn">'+s.n+'</div><div class="sc">Centro '+s.c+'</div></div><span class="arrow">&rsaquo;</span></a></li>';}
  h+='</ul></div>';
  document.getElementById("app").innerHTML=h;
  document.getElementById("srcInput").addEventListener("input",function(){var q=this.value.toLowerCase().trim();var items=document.querySelectorAll(".slist li");for(var j=0;j<items.length;j++){items[j].style.display=items[j].getAttribute("data-name").indexOf(q)>=0?"":"none";}});
}

function setFecha(id){var el=document.getElementById(id);if(!el)return;var now=new Date();el.textContent="Fecha de la consulta: "+now.toLocaleDateString("es-AR")+" "+now.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}

function openQRPanel(){var base=location.origin+location.pathname;document.getElementById("qrBaseInfo").textContent="URL: "+base;var overlay=document.getElementById("qrOverlay");var grid=document.getElementById("qrGrid");overlay.classList.add("open");grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#666">Generando '+D.length+' codigos QR...</div>';var sorted=D.slice().sort(function(a,b){return a.n.localeCompare(b.n);});setTimeout(function(){grid.innerHTML="";for(var i=0;i<sorted.length;i++){var s=sorted[i];var url=base+"?eess="+s.c;var item=document.createElement("div");item.className="qr-item";var qrDiv=document.createElement("div");item.appendChild(qrDiv);var nm=document.createElement("div");nm.className="qr-name";nm.textContent=s.n;item.appendChild(nm);var cd=document.createElement("div");cd.className="qr-code";cd.textContent="Centro "+s.c;item.appendChild(cd);grid.appendChild(item);new QRCode(qrDiv,{text:url,width:180,height:180,colorDark:"#002b5c",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});}},150);}
function closeQRPanel(){document.getElementById("qrOverlay").classList.remove("open");document.getElementById("qrGrid").innerHTML="";}
function setStatus(type,msg){document.getElementById("statusArea").innerHTML='<div class="status-banner" style="background:'+(type==="ok"?"#e8f4e8;color:#1a6b1a":type==="err"?"#fce8e8;color:#8b0000":"#e8f0fc;color:#1d3557")+'">'+msg+'</div>';}
function r2(n){return Math.round((parseFloat(n)||0)*100)/100;}
document.getElementById("fileInput").addEventListener("change",function(){if(!this.files[0])return;var file=this.files[0];setStatus("loading","&#9203; Procesando <strong>"+file.name+"</strong>...");var vig=VIGENCIA;var m=file.name.match(/Vigencia[\s_\-]+(\d{1,2})[._](\d{1,2})[._](\d{4})/i);if(m)vig=m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0")+"/"+m[3];var reader=new FileReader();reader.onload=function(e){try{var data=new Uint8Array(e.target.result);var wb=XLSX.read(data,{type:"array"});var ws=wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});var ns=[];for(var i=2;i<rows.length;i++){var r=rows[i];if(!r||!r[0]||!r[1])continue;var code=parseInt(r[0]);if(isNaN(code))continue;var div=parseInt(r[2])||0;if(div!==THIS_DIV)continue;var fuels={};var fmap=[["s",4],["in",12],["d5",20],["id",28]];for(var j=0;j<fmap.length;j++){var key=fmap[j][0],col=fmap[j][1];try{fuels[key]=[r2(r[col]),r2(r[col+1]),r2(r[col+2]),parseFloat(r[col+3])||0,r2(r[col+4]),r2(r[col+5]),r2(r[col+6])];}catch(ex){}}ns.push({c:code,n:String(r[1]).trim(),d:div,f:fuels});}if(ns.length<1){setStatus("err","&#10060; No se encontraron estaciones.");return;}D=ns;VIGENCIA=vig;renderLanding();setStatus("ok","&#9989; <strong>"+ns.length+" estaciones</strong> actualizadas &mdash; Vigencia: <strong>"+vig+"</strong>");}catch(ex){setStatus("err","&#10060; Error: "+ex.message);}};reader.readAsArrayBuffer(file);this.value="";});

var code=getCode();
if(code){var found=null;for(var i=0;i<D.length;i++){if(String(D[i].c)===String(code)){found=D[i];break;}}
  if(found)renderStation(found);else document.getElementById("app").innerHTML='<div style="text-align:center;padding:40px;color:#999">Estacion no encontrada</div>';
}else{renderLanding();}
setFecha("fechaConsulta");
</script></body></html>
