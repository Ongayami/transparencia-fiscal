<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Transparencia Fiscal — Divisional 2 Patagonia Sur — ACA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh;-webkit-font-smoothing:antialiased}
.top-bar{background:#002b5c;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.top-bar .logo{width:36px;height:36px;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}
.top-bar .tit{font-size:14px;font-weight:600;letter-spacing:.02em}
.top-bar .sub{font-size:11px;opacity:.7;margin-top:2px}
.top-bar .spacer{flex:1}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px;font-weight:500;opacity:.85;cursor:pointer}
.back-btn:hover{opacity:1}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.action-btn{border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.action-btn:hover{transform:scale(1.03)}
.action-btn svg{width:15px;height:15px}
.btn-update{background:#f0a500;color:#002b5c;box-shadow:0 2px 8px rgba(240,165,0,.3)}
.btn-update:hover{background:#ffc233}
.btn-qr{background:#fff;color:#002b5c;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.btn-qr:hover{background:#e8ecf2}
.station-hdr{background:#fff;padding:20px;border-bottom:1px solid #ddd}
.station-name{font-size:22px;font-weight:700;color:#002b5c}
.station-meta{font-size:13px;color:#555;margin-top:4px}
.vig{display:inline-block;margin-top:8px;background:#e8f4e8;color:#1a6b1a;font-size:12px;font-weight:600;padding:4px 10px;border-radius:4px}
.content{padding:16px;max-width:520px;margin:0 auto}
.fuel-card{background:#fff;border-radius:10px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.fuel-hdr{padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.fuel-nm{font-size:15px;font-weight:600}
.fuel-pr{font-size:24px;font-weight:700}
.fuel-body{padding:14px 16px 16px}
.bar-c{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:6px}
.bar-s{height:100%}
.bar-l{display:flex;justify-content:space-between;font-size:11px;color:#666;margin-bottom:14px;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13px}
tr td{padding:7px 0;border-bottom:1px solid #f0f0f0}
tr:last-child td{border-bottom:none}
.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.sb{font-size:10px;color:#888}
.rb td{color:#002b5c;font-weight:600}
.rti td{font-weight:600;border-top:2px solid #ddd;padding-top:10px;color:#8b0000}
.rf td{font-weight:700;font-size:15px;padding-top:10px;color:#002b5c}
.legal{background:#fafafa;border-top:1px solid #eee;padding:14px 20px;font-size:10px;color:#999;line-height:1.5;text-align:center}
.footer{text-align:center;padding:20px;font-size:11px;color:#888}
.footer a{color:#002b5c;text-decoration:none}
.landing{max-width:520px;margin:0 auto;padding:20px}
.div-badge{display:inline-block;background:#002b5c;color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:8px;margin-bottom:16px}
.search-box{position:relative;margin-bottom:20px}
.search-box input{width:100%;padding:14px 16px 14px 44px;border:2px solid #ddd;border-radius:10px;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:#002b5c}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#999}
.slist{list-style:none}
.slist li{background:#fff;margin-bottom:8px;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.slist li a{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;text-decoration:none;color:#1a1a2e;transition:background .15s}
.slist li a:hover,.slist li a:active{background:#f5f7fa}
.slist .sn{font-weight:600;font-size:14px;color:#002b5c}
.slist .sc{font-size:12px;color:#888;margin-top:2px}
.slist .arrow{color:#ccc;font-size:18px}
.status-banner{max-width:520px;margin:16px auto 0;padding:14px 18px;border-radius:10px;font-size:13px;line-height:1.5;display:none}
.status-banner.ok{display:block;background:#e8f4e8;color:#1a6b1a}
.status-banner.err{display:block;background:#fce8e8;color:#8b0000}
.status-banner.loading{display:block;background:#e8f0fc;color:#1d3557}
#fileInput{display:none}
.qr-overlay{display:none;position:fixed;inset:0;background:#fff;z-index:1000;overflow-y:auto}
.qr-overlay.open{display:block}
.qr-toolbar{position:sticky;top:0;background:#002b5c;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:10}
.qr-toolbar .spacer{flex:1}
.qr-toolbar button{background:#fff;color:#002b5c;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.qr-toolbar button:hover{background:#e8ecf2}
.qr-toolbar .close-btn{background:transparent;color:#fff;font-size:24px;padding:4px 10px}
.qr-toolbar .close-btn:hover{opacity:.7}
.qr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:24px;max-width:900px;margin:0 auto}
.qr-item{text-align:center;padding:16px;border:1px solid #eee;border-radius:10px;break-inside:avoid}
.qr-item canvas{display:block;margin:0 auto 10px}
.qr-item .qr-name{font-size:14px;font-weight:700;color:#002b5c}
.qr-item .qr-code{font-size:11px;color:#888;margin-top:2px}
@media print{
  .qr-toolbar{display:none!important}
  .qr-grid{gap:12px;padding:12px}
  .qr-item{border:1px solid #ddd;padding:10px}
  body>*:not(.qr-overlay){display:none!important}
  .qr-overlay{position:static!important}
}
</style>
</head>

function fmt(n){ return n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtI(n){ return n.toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0}); }
function getCode(){ var p=new URLSearchParams(location.search); return p.get("eess")||p.get("EESS")||null; }

function renderStation(s){
  var tb=document.getElementById("topbar");
  tb.innerHTML='<a class="back-btn" onclick="location.href=location.pathname">&larr; Volver</a>'
    +'<div style="flex:1;margin-left:8px"><div class="tit">Autom\u00f3vil Club Argentino</div>'
    +'<div class="sub">Transparencia Fiscal &mdash; Divisional 2</div></div>';
  var h='<div class="station-hdr"><div class="station-name">EESS '+s.n+'</div>'
    +'<div class="station-meta">Centro ACA '+s.c+' &mdash; Divisional '+s.d+'</div>'
    +'<div class="vig">Vigencia: '+VIGENCIA+'</div></div><div class="content">';
  var keys=["s","in","d5","id"];
  for(var ki=0;ki<keys.length;ki++){
    var k=keys[ki]; var v=s.f[k]; if(!v)continue;
    var pn=v[0],icl=v[1],idc=v[2],aliq=v[3],iva=v[4],ti=v[5],pf=v[6];
    if(pf===0)continue;
    var info=FC[k]; var label=info[0],accent=info[1],light=info[2];
    var pctI=(ti/pf*100),pctN=100-pctI;
    h+='<div class="fuel-card"><div class="fuel-hdr" style="background:'+accent+'">'
      +'<span class="fuel-nm">'+label+'</span><span class="fuel-pr">$'+fmtI(pf)+'</span></div>'
      +'<div class="fuel-body"><div class="bar-c">'
      +'<div class="bar-s" style="width:'+pctN.toFixed(1)+'%;background:'+accent+'"></div>'
      +'<div class="bar-s" style="width:'+pctI.toFixed(1)+'%;background:'+light+'"></div></div>'
      +'<div class="bar-l"><span style="color:'+accent+'">Precio base '+pctN.toFixed(1)+'%</span>'
      +'<span>Impuestos '+pctI.toFixed(1)+'%</span></div>'
      +'<table><tr class="rb"><td>Precio neto de impuestos</td><td class="v">$'+fmt(pn)+'</td></tr>'
      +'<tr><td>ICL <span class="sb">(Imp. s/ Comb. L\u00edquidos)</span></td><td class="v">$'+fmt(icl)+'</td></tr>'
      +'<tr><td>IDC <span class="sb">(Imp. al Di\u00f3xido de Carbono)</span></td><td class="v">$'+fmt(idc)+'</td></tr>'
      +'<tr><td>IVA <span class="sb">('+Math.round(aliq*100)+'%)</span></td><td class="v">$'+fmt(iva)+'</td></tr>'
      +'<tr class="rti"><td>Total Impuestos Nacionales</td><td class="v">$'+fmt(ti)+'</td></tr>'
      +'<tr class="rf"><td>Precio Final</td><td class="v">$'+fmtI(pf)+'</td></tr></table></div></div>';
  }
  h+='</div><div class="legal">Res. SE 1/2025 &mdash; Los precios incluyen impuestos nacionales (ICL, IDC, IVA). No incluye tasas municipales ni impuestos provinciales.</div>'
    +'<div class="footer">Autom\u00f3vil Club Argentino &mdash; <a href="https://www.aca.org.ar">aca.org.ar</a></div>';
  document.getElementById("app").innerHTML=h;
  document.title="Transparencia Fiscal \u2014 EESS "+s.n+" \u2014 ACA";
}

  h+='</ul></div>';
  document.getElementById("app").innerHTML=h;
  document.getElementById("srcInput").addEventListener("input",function(){

function openQRPanel(){
  var base=location.origin+location.pathname;
  document.getElementById("qrBaseInfo").textContent="URL: "+base;
  var overlay=document.getElementById("qrOverlay");
  var grid=document.getElementById("qrGrid");
  overlay.classList.add("open");
  grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#666">Generando '+D.length+' c\u00f3digos QR...</div>';
  var sorted=D.slice().sort(function(a,b){return a.n.localeCompare(b.n);});
  setTimeout(function(){
    grid.innerHTML="";
    for(var i=0;i<sorted.length;i++){
      var s=sorted[i];
      var url=base+"?eess="+s.c;
      var item=document.createElement("div");item.className="qr-item";
      var qrDiv=document.createElement("div");item.appendChild(qrDiv);
      var nm=document.createElement("div");nm.className="qr-name";nm.textContent=s.n;item.appendChild(nm);
      var cd=document.createElement("div");cd.className="qr-code";cd.textContent="Centro "+s.c;item.appendChild(cd);
      grid.appendChild(item);
      new QRCode(qrDiv,{text:url,width:180,height:180,colorDark:"#002b5c",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
    }
  },150);
}
function closeQRPanel(){document.getElementById("qrOverlay").classList.remove("open");document.getElementById("qrGrid").innerHTML="";}

function setStatus(type,msg){document.getElementById("statusArea").innerHTML='<div class="status-banner '+type+'">'+msg+'</div>';}
function r2(n){return Math.round((parseFloat(n)||0)*100)/100;}

document.getElementById("fileInput").addEventListener("change",function(){
  if(!this.files[0])return;
  var file=this.files[0];
  setStatus("loading","&#9203; Procesando <strong>"+file.name+"</strong>...");
  var vig=VIGENCIA;
  var m=file.name.match(/Vigencia[\s_\-]+(\d{1,2})[._](\d{1,2})[._](\d{4})/i);
  if(m)vig=m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0")+"/"+m[3];
  var m2=file.name.match(/Vigencia[\s_]+(\d{1,2})[\s_]+(\d{1,2})[\s_]+(\d{4})/i);
  if(m2)vig=m2[1].padStart(2,"0")+"/"+m2[2].padStart(2,"0")+"/"+m2[3];
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
      var ns=[];
      for(var i=2;i<rows.length;i++){
        var r=rows[i];if(!r||!r[0]||!r[1])continue;
        var code=parseInt(r[0]);if(isNaN(code))continue;
        var div=parseInt(r[2])||0;
        if(div!==THIS_DIV)continue;
        var fuels={};
        var fmap=[["s",4],["in",12],["d5",20],["id",28]];
        for(var j=0;j<fmap.length;j++){var key=fmap[j][0],col=fmap[j][1];
          try{fuels[key]=[r2(r[col]),r2(r[col+1]),r2(r[col+2]),parseFloat(r[col+3])||0,r2(r[col+4]),r2(r[col+5]),r2(r[col+6])];}catch(ex){}}
        ns.push({c:code,n:String(r[1]).trim(),d:div,f:fuels});
      }
      if(ns.length<1){setStatus("err","&#10060; No se encontraron estaciones de la Divisional 2.");return;}
      D=ns;VIGENCIA=vig;renderLanding();
      setStatus("ok","&#9989; <strong>"+ns.length+" estaciones</strong> actualizadas &mdash; Vigencia: <strong>"+vig+"</strong>");
    }catch(ex){setStatus("err","&#10060; Error: "+ex.message);}
  };
  reader.readAsArrayBuffer(file);this.value="";
});

var code=getCode();
if(code){var found=null;for(var i=0;i<D.length;i++){if(String(D[i].c)===String(code)){found=D[i];break;}}
  if(found)renderStation(found);else document.getElementById("app").innerHTML='<div style="text-align:center;padding:40px;color:#999">Estaci\u00f3n no encontrada</div>';
}else{renderLanding();}
</script>
