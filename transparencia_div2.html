<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Transparencia Fiscal — Divisional 2 Patagonia Sur — ACA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#f0f2f5;min-height:100vh;-webkit-font-smoothing:antialiased}
.header{background:#002b5c;color:#fff;padding:20px;text-align:center}
.header .logo{font-size:28px;font-weight:900;letter-spacing:.08em;margin-bottom:6px}
.header .hsubtitle{font-size:13px;font-weight:400;opacity:.85;letter-spacing:.02em}
.header .hdate{font-size:11px;opacity:.6;margin-top:4px}
.header .spacer{flex:1}
.header-wrap{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.action-btn{border:none;padding:7px 12px;border-radius:8px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.action-btn:hover{transform:scale(1.03)}
.btn-update{background:#f0a500;color:#002b5c}
.btn-qr{background:rgba(255,255,255,.2);color:#fff}
.station-bar{background:#fff;padding:14px 20px;border-bottom:2px solid #002b5c;text-align:center}
.station-bar .sname{font-size:17px;font-weight:700;color:#002b5c}
.station-bar .smeta{font-size:12px;color:#888;margin-top:2px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:12px;font-weight:500;opacity:.8;cursor:pointer;position:absolute;left:16px;top:18px}
.cards{padding:16px;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.fuel-card{display:flex;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.fuel-sidebar{width:56px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fuel-sidebar .fuel-label{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-size:15px;font-weight:900;color:#fff;letter-spacing:.06em;text-transform:uppercase}
.fuel-content{flex:1;background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.row-pvp{display:flex;flex-direction:column;gap:2px}
.row-pvp .label{font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.04em}
.row-pvp .value-box{padding:10px 14px;border-radius:6px;text-align:center}
.row-pvp .value{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.detail-grid{display:grid;grid-template-columns:1fr auto;gap:0;font-size:12px}
.detail-grid .dl{padding:5px 0;border-bottom:1px solid #f0f0f0;color:#444}
.detail-grid .dv{padding:5px 0;border-bottom:1px solid #f0f0f0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:#333}
.detail-grid .dl.sub{color:#888;padding-left:8px;font-size:11px}
.detail-grid .dl.total-imp{font-weight:700;border-top:2px solid #ddd;padding-top:8px;color:#8b0000}
.detail-grid .dv.total-imp{font-weight:700;border-top:2px solid #ddd;padding-top:8px;color:#8b0000}
.fuel-super .fuel-sidebar{background:linear-gradient(180deg,#1a7a6a,#23a88a)}
.fuel-super .row-pvp .value-box{background:#e6f5f0;color:#1a7a6a}
.fuel-infinia .fuel-sidebar{background:linear-gradient(180deg,#0d3b66,#1a6aaa)}
.fuel-infinia .row-pvp .value-box{background:#e0eef8;color:#0d3b66}
.fuel-d500 .fuel-sidebar{background:linear-gradient(180deg,#1b3a5c,#2c6faa)}
.fuel-d500 .row-pvp .value-box{background:#e0eaf4;color:#1b3a5c}
.fuel-idiesel .fuel-sidebar{background:linear-gradient(180deg,#4a5d1e,#6d8a2e)}
.fuel-idiesel .row-pvp .value-box{background:#eef3e0;color:#4a5d1e}
.legal{text-align:center;padding:16px 20px;font-size:9px;color:#aaa;line-height:1.5}
.footer{text-align:center;padding:10px 20px 24px;font-size:11px;color:#888}
.footer a{color:#002b5c;text-decoration:none;font-weight:600}
/* Landing */
.landing{max-width:440px;margin:0 auto;padding:20px}
.div-badge{display:inline-block;background:#002b5c;color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:8px;margin-bottom:16px}
.search-box{position:relative;margin-bottom:16px}
.search-box input{width:100%;padding:14px 16px 14px 44px;border:2px solid #ddd;border-radius:10px;font-size:15px;font-family:inherit;outline:none}
.search-box input:focus{border-color:#002b5c}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#999}
.slist{list-style:none}
.slist li{background:#fff;margin-bottom:8px;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.slist li a{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;text-decoration:none;color:#1a1a2e}
.slist li a:hover{background:#f5f7fa}
.slist .sn{font-weight:600;font-size:14px;color:#002b5c}
.slist .sc{font-size:12px;color:#888;margin-top:2px}
.slist .arrow{color:#ccc;font-size:18px}
#fileInput{display:none}
.qr-overlay{display:none;position:fixed;inset:0;background:#fff;z-index:1000;overflow-y:auto}
.qr-overlay.open{display:block}
.qr-toolbar{position:sticky;top:0;background:#002b5c;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:10}
.qr-toolbar .spacer{flex:1}
.qr-toolbar button{background:#fff;color:#002b5c;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.qr-toolbar .close-btn{background:transparent;color:#fff;font-size:24px;padding:4px 10px}
.qr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:24px;max-width:900px;margin:0 auto}
.qr-item{text-align:center;padding:16px;border:1px solid #eee;border-radius:10px}
.qr-item canvas{display:block;margin:0 auto 10px}
.qr-item .qr-name{font-size:14px;font-weight:700;color:#002b5c}
.qr-item .qr-code{font-size:11px;color:#888;margin-top:2px}
.status-banner{max-width:440px;margin:12px auto 0;padding:14px 18px;border-radius:10px;font-size:13px;line-height:1.5}
@media print{.qr-toolbar{display:none!important}.qr-grid{gap:12px;padding:12px}.qr-item{border:1px solid #ddd;padding:10px}body>*:not(.qr-overlay){display:none!important}.qr-overlay{position:static!important}}
</style>
</head>

var FC={s:["Super","fuel-super"],in:["Infinia","fuel-infinia"],d5:["Diesel 500","fuel-d500"],id:["Infinia Diesel","fuel-idiesel"]};
function fmt(n){return n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtI(n){return n.toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0});}
function getCode(){var p=new URLSearchParams(location.search);return p.get("eess")||p.get("EESS")||null;}

function renderStation(s){
  var tb=document.getElementById("topbar");
  tb.innerHTML='<a class="back-btn" onclick="location.href=location.pathname">&larr; Volver</a><div class="logo">ACA</div><div class="hsubtitle">Regimen de transparencia fiscal al consumidor</div><div class="hdate" id="fechaConsulta2"></div>';

function renderLanding(){

  tb.innerHTML='<div class="logo">ACA</div><div class="hsubtitle">Transparencia Fiscal &mdash; Divisional 2 &middot; Patagonia Sur</div><div style="margin-top:10px" class="btn-group"><button class="action-btn btn-update" onclick="document.getElementById(\'fileInput\').click()">Actualizar Precios</button><button class="action-btn btn-qr" onclick="openQRPanel()">Generar QR</button></div>';

}

function setFecha(id){var el=document.getElementById(id);if(!el)return;var now=new Date();el.textContent="Fecha de la consulta: "+now.toLocaleDateString("es-AR")+" "+now.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}

function closeQRPanel(){document.getElementById("qrOverlay").classList.remove("open");document.getElementById("qrGrid").innerHTML="";}

function r2(n){return Math.round((parseFloat(n)||0)*100)/100;}
document.getElementById("fileInput").addEventListener("change",function(){if(!this.files[0])return;var file=this.files[0];setStatus("loading","&#9203; Procesando <strong>"+file.name+"</strong>...");var vig=VIGENCIA;var m=file.name.match(/Vigencia[\s_\-]+(\d{1,2})[._](\d{1,2})[._](\d{4})/i);if(m)vig=m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0")+"/"+m[3];var reader=new FileReader();reader.onload=function(e){try{var data=new Uint8Array(e.target.result);var wb=XLSX.read(data,{type:"array"});var ws=wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});var ns=[];for(var i=2;i<rows.length;i++){var r=rows[i];if(!r||!r[0]||!r[1])continue;var code=parseInt(r[0]);if(isNaN(code))continue;var div=parseInt(r[2])||0;if(div!==THIS_DIV)continue;var fuels={};var fmap=[["s",4],["in",12],["d5",20],["id",28]];for(var j=0;j<fmap.length;j++){var key=fmap[j][0],col=fmap[j][1];try{fuels[key]=[r2(r[col]),r2(r[col+1]),r2(r[col+2]),parseFloat(r[col+3])||0,r2(r[col+4]),r2(r[col+5]),r2(r[col+6])];}catch(ex){}}ns.push({c:code,n:String(r[1]).trim(),d:div,f:fuels});}if(ns.length<1){setStatus("err","&#10060; No se encontraron estaciones.");return;}D=ns;VIGENCIA=vig;renderLanding();setStatus("ok","&#9989; <strong>"+ns.length+" estaciones</strong> actualizadas &mdash; Vigencia: <strong>"+vig+"</strong>");}catch(ex){setStatus("err","&#10060; Error: "+ex.message);}};reader.readAsArrayBuffer(file);this.value="";});

var code=getCode();
if(code){var found=null;for(var i=0;i<D.length;i++){if(String(D[i].c)===String(code)){found=D[i];break;}}
  if(found)renderStation(found);else document.getElementById("app").innerHTML='<div style="text-align:center;padding:40px;color:#999">Estacion no encontrada</div>';
